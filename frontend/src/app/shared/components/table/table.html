<div class="overflow-x-auto">
  @if (isLoading) {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>
  }

  @if (!isLoading && rows.length > 0) {
    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-slate-100 border-b border-slate-300">
          @for (col of columns; track $index) {
            <th
              [style.width]="col.width || 'auto'"
              class="px-6 py-3 text-left text-sm font-semibold text-slate-700"
            >
              {{ col.label }}
            </th>
          }
        </tr>
      </thead>

      <tbody>
        @for (row of rows; track $index) {
          <tr class="border-b border-slate-200 hover:bg-slate-50 transition-colors">
            <td *ngFor="let col of columns" class="px-6 py-4 text-sm text-slate-700">
              {{ formatValue(getNestedValue(row, col.key)) }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (!isLoading && rows.length === 0) {
    <div class="flex flex-col items-center justify-center h-64 text-slate-500">
      <svg
        class="w-12 h-12 mb-4 text-slate-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        />
      </svg>
      <p>{{ emptyMessage }}</p>
    </div>
  }
</div>
